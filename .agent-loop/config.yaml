project:
  name: gm-board
  use_worktree: false

backend:
  type: cli

git:
  remote: origin
  base_branch: feature/unified-character-storage
  allow_dirty: false
  worktree_root: ../agent-worktrees
  require_clean_repo: true
  delete_worktree_on_success: false
  delete_worktree_on_failure: false
  # Each implementation run file supplies its own branch mode and agent_branch.
  # The orchestrator commits only after the full suite passes and the reviewer
  # explicitly approves; plan-only tasks remain branchless.
  commit_on_success: true

limits:
  # Effectively uncapped. A full, clean feature port creates many modules, takes
  # many fix iterations, and runs long; do not cut the agent off mid-build.
  max_fix_attempts: 6
  max_changed_files: 1000
  phase_timeout_seconds: 36000
  # No max_budget_usd: Claude subscription (Plus) has no per-dollar billing, so a
  # cap only stops phases early at a phantom API cost. The real limit is the
  # plan's usage window. Each phase is bounded by phase_timeout_seconds.

testing:
  policy: required
  paths:
    - react-app/src/*.test.js
    - react-app/src/**/*.test.js
    - react-app/src/*.spec.js
    - react-app/src/**/*.spec.js
    - react-app/test/**
    - react-app/tests/**
  forbid_test_deletion: true

verification:
  timeout_seconds: 600
  commands:
    - git diff --check
    - npm --prefix react-app test
    - npm --prefix react-app run build

blocked_commands:
  - git push
  - git commit  # Blocked for agents; the orchestrator owns approved checkpoints.
  - rm -rf
  - npm publish
  - pnpm publish
  - yarn publish
  - docker compose down -v
  - jupyter nbconvert --execute
  - wandb sweep
  - wandb agent

project_context:
  data_sources:
    data_repo: "https://github.com/5etools-mirror-3/5etools-src/tree/main/data"
    image_repo: "https://github.com/5etools-mirror-3/5etools-img"
  allowed_sources:
    - XPHB
    - XMM
    - XDMG
    - FRAIF
    - FRHOF
    - EFA
    - RWH
  rules:
    - "Prefer minimal changes."
    - "GM-Board fetches D&D data at runtime from the configured 5etools data repository."
    - "GM-Board resolves images/assets from the configured 5etools image repository."
    - "Only D&D 5.5e / 2024 source codes are allowed: XPHB, XMM, XDMG, FRAIF, FRHOF, EFA, RWH."
    - "Ignore or reject any source outside the whitelist."
    - "Do not use legacy 2014 sources such as PHB, DMG, MM unless explicitly mapped to an allowed 2024 source code."
    - "Do not use homebrew, unofficial sources, or non-whitelisted sources."
    - "Do not copy, vendor, or commit 5etools JSON files or image assets into GM-Board."
    - "Preserve runtime fetching behavior; do not replace it with local vendored copies."
