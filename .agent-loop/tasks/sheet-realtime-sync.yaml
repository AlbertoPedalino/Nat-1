agent: codex
backend: cli

# Write-capable build on an isolated in-place branch (never the base branch).
plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feat/combat-sheet-hp-sync
agent_branch: feat/sheet-realtime-sync
allow_dirty: true

task: |
  Make the Encounter Builder combat <-> campaign character sheet sync REAL-TIME via
  a Supabase Realtime (websocket) subscription, and extend the synced fields to
  include max HP (inbound only) and temp HP (two-way) on the encounter combat
  entries. Builds on the existing debounced outbound sync (branch
  feat/combat-sheet-hp-sync, already merged into the working tree).

  Project memory (.agent-loop/memory.md) documents the encounter builder, sheet,
  campaign import, cloud layer, AND the existing HP/death-save sync. USE IT. Only
  read the files below in depth.

  ## What already exists (do NOT rebuild)

  - `pages/encounterbuilder/logic/sheetSync.js`: pure mappers
    `sheetVitalsToCombat` / `combatantToSheetPatch` (currentHP, tempHP, deathSaves).
  - `pages/encounterbuilder/hooks/useFightSheetSync.js`: DEBOUNCED OUTBOUND
    (combat -> cloud) via `patch_character_data` RPC; per-charId debounce; diffs a
    last-synced snapshot; skips monsters / manual PCs; fail-soft.
  - `shared/cloud/cloudCharacters.js` `patchCharacterData(charId, patch)` -> RPC
    `public.patch_character_data(p_id text, p_patch jsonb)` (allowlist
    ['currentHP','tempHP','deathSaves'], shallow `data || clean` merge, security
    invoker). SQL in `react-app/supabase/combat_sync.sql`.
  - Inbound at launch only: import projection seeds combat from the sheet; combat
    snapshots persist `tempHP`.
  - `pages/campaigns/sheetSummary.js` `summarizeCharacter(C)` derives sheet vitals
    from a character `data` object (returns currentHP, maxHP, ac, ...). maxHP is
    DERIVED (`charsheet` `calcMaxHP`), NOT stored in `data`.

  ## Goal A — Real-time inbound (websocket)

  Add a Supabase Realtime subscription so that when a linked campaign character's
  row changes (player edits their sheet, or another client writes), the OPEN combat
  updates that player combatant live — no reload.

  - Enable Realtime on the table: in `react-app/supabase/combat_sync.sql` append an
    idempotent `alter publication supabase_realtime add table public.characters;`
    (guard so re-running the file doesn't error if already added). Document in the
    setup notes that this SQL must be re-run once on Supabase. RLS still gates which
    rows a client receives, so no policy change is needed.
  - Subscribe in a hook (extend `useFightSheetSync` or add `useSheetRealtime`,
    wired from `EncounterBuilderContext`). Subscribe to `postgres_changes` UPDATE on
    `public.characters`, scoped to the character ids currently in the fight
    (player combatants with `sourceId`). On an inbound row:
      * derive vitals from the incoming `data` via the SAME path used at launch
        (reuse `summarizeCharacter` + `sheetSync` mappers — one source of truth),
      * dispatch a reducer action to apply them to the matching combatant by
        `sourceId`. KEEP THE REDUCER PURE: the subscription lives in the hook; the
        reducer only applies the already-derived vitals.
  - ECHO SUPPRESSION (critical): our own outbound writes will come back over the
    channel. Do not let inbound fight outbound. Track the last value we wrote per
    charId (value-based, or `updated_at`/version) and ignore an inbound payload that
    matches what we just sent. Inbound application must also be idempotent
    (no-op when equal) so the two directions converge instead of oscillating.
  - Lifecycle: open the channel only in combat view with linked PCs; tear it down on
    unmount / leaving combat / fight change. Fail-soft (no crash if Realtime is
    disabled or the socket drops; combat keeps working).

  ## Goal B — Max HP (inbound only) + Temp HP (two-way) on combat entries

  - maxHP: sheet-DERIVED, so it is INBOUND ONLY. Never write maxHP to the cloud
    (not in the allowlist; keep it out). When a linked PC's maxHP changes (inbound
    launch or realtime), update the combatant `hpMax` AND clamp `hpCurrent` to the
    new max. Show maxHP in the combat entry (CombatantCard) as it already does.
  - tempHP: stored in `data`, already allowlisted, so it is TWO-WAY. Add temp HP to
    the player combatant entry UI (CombatantCard) so the GM can view/set it;
    changing it flows outbound (debounced) like currentHP, and inbound/realtime
    updates it. Extend `combat.js` (build/snapshot/mutators) and the mappers as
    needed so tempHP is a first-class combatant field with clamping (>= 0).
  - Manual PCs (no `sourceId`) and monsters: tempHP/maxHP stay local; no cloud I/O.

  ## Reducer / combat changes

  - Add a pure mutator in `logic/combat.js` (e.g. `applySheetVitals(combat,
    sourceId, vitals)`) and a reducer action (e.g. `syncCombatantVitals`) that
    updates the matching combatant's hpCurrent / hpMax / tempHP / deathSaves with
    clamps. Reuse `sheetVitalsToCombat`. No async in the reducer.
  - Ensure `buildCombat`, `snapshotFight`, and `restoreFight` carry tempHP so
    resumed fights keep it and don't write stale values back.

  ## Architecture requirements (clean, scalable, maintainable)

  - One source of truth for the combat<->sheet field contract (the `sheetSync`
    mappers); realtime inbound and launch inbound MUST share it. One generic RPC for
    outbound (unchanged). Realtime isolated in its own hook with explicit
    subscribe/unsubscribe and echo suppression.
  - Reducer pure; all I/O (RPC, websocket) in hooks. MUI + existing toast for any
    feedback. No dead code, no console noise, brief comments for non-obvious logic
    (especially echo suppression), naming consistent with the codebase.

  ## Constraints

  - Runtime fetch only: never vendor/copy/commit 5etools JSON or image assets.
  - Only whitelisted 2024 sources per .agent-loop/config.yaml.
  - Cloud writes ONLY through the existing `patch_character_data` RPC + client
    helper; do not add a second write path or new table. New SQL (realtime
    publication only) goes in `react-app/supabase/combat_sync.sql`.
  - Do not change the character builder/sheet schema beyond reading existing
    `currentHP` / `tempHP` / `deathSaves` and the derived maxHP.
  - Do not commit, push, or switch the base/protected branch.

  ## Verification

  - cd react-app && npm run build   (must pass; real gate)
  - cd react-app && npm test        (extend tests: tempHP in mappers/buildCombat;
    applySheetVitals clamping incl. maxHP change re-clamping hpCurrent; echo-
    suppression logic if unit-testable)
  - git diff --check
  - Manual (two clients / two tabs, signed in):
      * open a fight with imported campaign PCs; in another tab open one PC's sheet;
        change the sheet's currentHP/tempHP -> the open combat entry updates live
        (no reload);
      * change HP/tempHP/death saves in combat -> the sheet reflects it live; verify
        NO oscillation/echo loop;
      * level/CON change that alters derived maxHP -> combat hpMax updates and
        hpCurrent re-clamps;
      * monsters and manual PCs never subscribe or write; Realtime off / socket drop
        -> combat still works (fail-soft).
