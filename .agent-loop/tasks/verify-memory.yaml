agent: codex
backend: cli
use_worktree: false
plan_only: true

task: |
  Audit .agent-loop/memory.md against the current GM-Board codebase and fix
  every claim that is wrong, stale, or no longer matches the code on this
  branch.

  ## Goal

  Memory is injected into every future run; a wrong claim silently misleads
  every later agent. Verify each statement against the source it refers to
  and produce a corrected memory. Do NOT re-explore the whole app from
  scratch: use the memory itself as the checklist and read only the files
  needed to confirm or refute each claim.

  ## Method

  Go section by section (Project Rules, UI Conventions, Entry Points,
  Encounter Builder, Combat Sheet Sync, Campaign Sheets, Character Builder /
  Sheet, Cloud / Supabase, Persistence, Verification, Gotchas). For each
  claim:
  - confirm the named file/export/route/table still exists at the stated path;
  - confirm the described behavior matches the code (spot-read, do not assume);
  - flag claims that are true but incomplete (e.g. a hook or route added since
    the memory was written) and extend them;
  - drop claims about code that no longer exists.

  Pay extra attention to areas most likely drifted:
  - routes in src/App.jsx vs the Entry Points section;
  - encounter builder hooks list vs the actual hooks/ directory;
  - combat sheet sync: patch_character_data RPC, allowlisted keys, debounce,
    realtime flag -- verify against react-app/supabase/*.sql,
    shared/cloud/cloudCharacters.js, hooks/useFightSheetSync.js;
  - Verification section: do the listed commands still match how the project
    is actually built/tested (react-app package.json scripts)?

  ## Output

  In the final report, list per section: verified / corrected / removed /
  added, each with the file that proves it. End the reply with the complete
  corrected memory in a fenced ```memory block (the orchestrator rewrites
  .agent-loop/memory.md from it). Preserve the existing structure and
  everything that is still accurate -- this is an audit, not a rewrite; keep
  it curated and concise, no per-run noise.

  ## Constraints

  - Read-only: do not modify application files, do not refactor, do not add
    runtime behavior. The only change to the repo is the memory update the
    orchestrator applies from the memory block.
  - Do not vendor or copy external 5etools data.
  - Use the project rules from .agent-loop/config.yaml.
  - Audit against the currently checked-out branch as-is.
