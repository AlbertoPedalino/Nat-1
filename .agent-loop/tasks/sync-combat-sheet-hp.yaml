agent: codex
backend: cli

# Write-capable build on an isolated in-place branch (never the base branch).
plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feature/unified-character-storage
agent_branch: feat/combat-sheet-hp-sync
allow_dirty: true

task: |
  Coordinate hit points and death saving throws between the Encounter Builder
  combat and the linked campaign character sheet (cloud), for player combatants
  imported from a campaign. Inbound: seed combat from the sheet's current state at
  launch. Outbound: write combat changes back to the cloud, debounced, via a
  GENERIC partial-patch RPC so future fields can be synced without new migrations.

  Project memory (.agent-loop/memory.md) documents the encounter builder, the
  character sheet, the campaign import, and the cloud layer. USE IT; only read the
  files below in depth.

  ## Data model (verified)

  - Campaign character object `C` (the cloud `data` jsonb blob; see
    `react-app/src/pages/charsheet/state.js`): top-level `currentHP` (number),
    `tempHP` (number), `deathSaves: { success, fail }` (each 0..3). `maxHP` is
    DERIVED (`logic/calculations.js` `calcMaxHP`), NOT stored — never write maxHP.
  - Encounter combatant (`logic/combat.js`): `hpCurrent`, `hpMax`,
    `deathSaves: { s, f }`, plus `sourceId` / `campaignId` for player combatants.
  - Cloud table (`react-app/supabase/schema.sql`): `public.characters`
    (`id text` PK, `owner uuid`, `data jsonb`, `updated_at`). RLS: update allowed
    when `owner = auth.uid() OR public.is_gm()` (policy `characters_update_own`).
  - Field mapping (combat <-> sheet):
      hpCurrent      <-> currentHP
      deathSaves.s   <-> deathSaves.success
      deathSaves.f   <-> deathSaves.fail
      tempHP: inbound seed only (no combat tempHP UI invented).

  ## Existing pieces to reuse (do NOT reinvent)

  - Import projection: `hooks/useCampaignPlayers.js` + `pages/campaigns/sheetSummary.js`
    `summarizeCharacter` already returns `currentHP` and `maxHP`. The encounter
    player shape currently keeps only `{ level, ac, hpMax, initMod, iconColor,
    sourceId, campaignId }` and DROPS currentHP/deathSaves/tempHP — extend it.
  - Combat build: `logic/combat.js` `buildCombat` seeds `hpCurrent = hpMax`.
  - Combat mutations: `logic/combat.js` `modifyHp` / `setHp` / `applyHp` /
    `setDeathSave`; reducer actions in `state/reducer.js`. KEEP THE REDUCER PURE —
    no async / no cloud calls inside the reducer.
  - Cloud client: `shared/cloud/cloudCharacters.js` (`requireClient`, TABLE =
    'characters'). Add the new generic patch helper here.

  ## 1) Generic partial-patch RPC (the clean, scalable write path)

  Do NOT rewrite the whole `data` blob (that clobbers concurrent sheet edits) and
  do NOT create a per-field function. Add ONE generic, allowlisted patch RPC in a
  new flat SQL file `react-app/supabase/combat_sync.sql` (same paste-into-SQL-editor
  convention as schema.sql; reference it from CLOUD_SETUP if such docs exist):

      create or replace function public.patch_character_data(p_id text, p_patch jsonb)
      returns void
      language plpgsql
      security invoker            -- runs as caller so characters RLS still applies
      set search_path = public
      as $$
      declare
        allowed text[] := array['currentHP','tempHP','deathSaves'];  -- extend later
        clean jsonb;
      begin
        select coalesce(jsonb_object_agg(key, value), '{}'::jsonb) into clean
        from jsonb_each(p_patch)
        where key = any(allowed);            -- drop non-syncable keys (anti-cheat)
        if clean = '{}'::jsonb then return; end if;
        update public.characters
          set data = data || clean,          -- atomic shallow top-level merge
              updated_at = now()
          where id = p_id;
      end; $$;

  Notes the agent must honor:
  - `security invoker` is REQUIRED so the existing `characters_update_own` policy
    (owner or GM) governs the write — no new bypass, no SECURITY DEFINER.
  - The allowlist is the field whitelist: RLS controls which ROWS, this controls
    which KEYS. Future sync fields are added by appending to `allowed` only.
  - Shallow `||` merge requires the client to send the COMPLETE sub-object for a
    patched top-level key (e.g. the full `deathSaves` object) — document this
    contract. (A recursive jsonb deep-merge is only needed if we later patch a
    single nested leaf without its parent; out of scope now.)

  Client helper (in `shared/cloud/cloudCharacters.js`):

      export async function patchCharacterData(charId, patch) {
        if (!charId || !patch) return;
        const { error } = await requireClient()
          .rpc('patch_character_data', { p_id: charId, p_patch: patch });
        if (error) throw error;
      }

  ## 2) Single mapping module (one source of truth)

  Add `pages/encounterbuilder/logic/sheetSync.js` with pure functions, reused by
  both directions:
  - `sheetVitalsToCombat(summary)` -> `{ hpCurrent, deathSaves: { s, f }, tempHP }`
    (clamp hpCurrent 0..maxHP, saves 0..3).
  - `combatantToSheetPatch(combatant)` -> `{ currentHP, tempHP, deathSaves: {
    success, fail } }` (the complete `deathSaves` sub-object).
  Adding a future synced field later = extend these mappers + the SQL `allowed`
  array; nothing else changes.

  ## 3) Inbound (sheet -> combat, at launch/import)

  - Extend the import projection to carry `currentHP`, `tempHP`, `deathSaves`.
  - `buildCombat` seeds a player combatant's `hpCurrent` from current HP (fallback
    hpMax when absent), `deathSaves.{s,f}` from `deathSaves.{success,fail}`.

  ## 4) Outbound (combat -> cloud, DEBOUNCED)

  - New hook `hooks/useFightSheetSync.js`, wired from `EncounterBuilderContext`.
    It watches `state.combat` player combatants (type player AND `sourceId`),
    diffs each against a last-synced snapshot, and for changed ones calls
    `patchCharacterData(sourceId, combatantToSheetPatch(combatant))`.
  - DEBOUNCE per `charId` (~500-800ms) and coalesce rapid HP taps: one timer per
    character, latest value wins. Skip monsters and manual PCs (no `sourceId`).
  - Fail soft: only attempt when signed in; on RLS/permission/network error show a
    toast and keep combat working. Never throw into the reducer or render.

  ## 5) Realtime inbound (STRETCH — optional, isolated, off by default)

  - A Supabase Realtime subscription on `characters` so a player editing their
    sheet mid-fight updates the open combat is OPTIONAL. If added, isolate it in
    the sync hook behind a flag and reconcile without fighting the outbound writer
    (ignore echoes of our own patch). Do NOT block the core feature on it.

  ## Architecture requirements (clean, scalable, maintainable)

  - Reducer pure; all I/O in `useFightSheetSync`. One mapping module is the single
    source of truth for the combat<->sheet field contract. One generic RPC + one
    client helper for all current and future synced fields.
  - Respect the shared character schema and clamps; the round-trip
    (sheet -> combat -> sheet) must not corrupt other fields.
  - MUI + existing toast. No dead code, no console noise, brief comments for
    non-obvious logic, naming consistent with the codebase.

  ## Constraints

  - Runtime fetch only: never vendor/copy/commit 5etools JSON or image assets.
  - Only whitelisted 2024 sources per .agent-loop/config.yaml.
  - Do not change the character builder/sheet schema beyond reading/patching the
    existing `currentHP` / `tempHP` / `deathSaves` fields.
  - Cloud writes ONLY through the new `patch_character_data` RPC + its client
    helper; do not add a second write path or new table. SQL goes in
    `react-app/supabase/combat_sync.sql`.
  - Do not commit, push, or switch the base/protected branch.

  ## Verification

  - cd react-app && npm run build   (must pass; real gate)
  - cd react-app && npm test        (add unit tests for sheetSync mappers and for
    buildCombat seeding from current HP/death saves)
  - git diff --check
  - Manual: import campaign players -> launch -> a PC starts at its sheet's current
    HP/death saves (not just max); damage/heal/death-save a PC in combat -> after
    the debounce the cloud row reflects new currentHP/deathSaves while other `data`
    fields are untouched (verify clobber-safety by editing another sheet field
    between combat changes); monsters and manual PCs never write; signed-out /
    no-permission writes fail soft. Confirm `patch_character_data` only accepts
    allowlisted keys (a patch with `level` must be ignored).
