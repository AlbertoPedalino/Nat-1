# Read-only audit of the accumulated project memory. Plan-only: the planner
# inspects the repository and reports; no source files are modified. The
# orchestrator may persist an updated memory block emitted by the planner.
agent: codex
backend: cli

plan_only: true
branch_mode: none
allow_dirty: true

task: |
  Audit `.agent-loop/memory.md` for correctness against the current state of
  the repository. Do not modify any repository file; produce a findings report.

  Note: memory.md was last rewritten on 2026-07-07 after a previous audit, so
  most entries should be current — verify them anyway, and pay extra attention
  to anything changed by work merged since then (not-found page, legacy
  fallback token fix if already applied).

  For EVERY claim in memory.md, verify it against the code and classify it:

  - CONFIRMED — still true; cite the file (and line where useful) that proves it.
  - STALE — was true but the code has moved on (renamed/moved/refactored);
    state what changed and what the entry should say now.
  - WRONG — does not match the repository at all; show the evidence.
  - UNVERIFIABLE — cannot be checked from the repository alone (e.g. process
    rules, claims about external services); say why.

  Specifically check:
  - Every file path and module name mentioned in memory.md exists at the
    stated location.
  - Architectural claims (data flow, shared schemas, storage layers, routing,
    cloud/RLS behavior) match the current implementation.
  - Gotchas are still applicable — in particular whether the "encounter token
    fallback uses legacy MM/Skeleton.webp" gotcha is still true or has been
    fixed (then the entry must be updated or removed).
  - Entries made obsolete by recent merges.

  End the report with:
  1. A summary table: entry -> classification.
  2. The list of entries that should be rewritten or deleted, in priority order.

  If corrections are needed, emit the corrected full memory in the standard
  memory block so the orchestrator can persist it.

  Scope guard: read-only audit. Do not edit memory.md or any other file
  directly; corrections travel only through the memory block.
