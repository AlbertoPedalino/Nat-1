agent: codex
backend: cli

# Write-capable build on an isolated in-place branch (never the base branch).
plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feature/unified-character-storage
agent_branch: feat/gmboard-html
allow_dirty: true

task: |
  Build directly on the standalone GM Board tool at
  `react-app/public/tools/gmboard.html`.

  Project memory (`.agent-loop/memory.md`) already documents the current GM Board
  architecture and behavior. USE IT as the parity spec. Do not re-explore the
  character builder, character sheet, encounter builder, adapter, or cloud layers
  unless a very narrow integration question requires it.

  ## Goal

  Improve and complete the existing standalone vanilla HTML/CSS/JS GM Board in
  place. The `/gmboard` route must continue to mount
  `react-app/public/tools/gmboard.html` through the existing iframe shell
  (`pages/gmboard/GmBoardPage.jsx` + `StandaloneHtmlFrame`) and the existing
  `SaveInstanceButton` bridge.

  This is NOT a React port. Do not replace the iframe with a native React page.
  Do not delete `public/tools/gmboard.html`. Do not move the GM Board into
  `react-app/src/pages/gmboard/` unless the user explicitly asks for a separate
  architecture migration.

  ## Current GM Board scope

  GM Board is the standalone DM utility with these views:

  - HEXcrawl
  - Dungeon
  - Quest
  - Tables
  - Guide

  In this file, "encounter" means an abstract table result generated by the GM
  Board tables. It does NOT mean the native React Encounter Builder's monster
  roster, initiative tracker, combat HP/death-save system, campaign player import,
  statblocks, or 5etools bestiary integration.

  ## Required behavior to preserve

  - Keep the route `/gmboard` working through `GmBoardPage.jsx`.
  - Keep `?board=new`, saved board ids, active board reuse, and legacy default
    migration behavior.
  - Keep the postMessage save contract:
    - React sends `gb:save-instance` / `gb:request-instance-state`.
    - iframe replies with `{ type:'gb:instance-state', kind:'gmboard', id, saved }`.
  - Keep Home integration through `shared/localStorageRegistries.js`:
    - route `/gmboard?board=<id>`
    - new route `/gmboard?board=new`
    - scoped key prefix `gb:board:<id>:`
  - Preserve the scoped localStorage monkey patch for legacy GM Board keys:
    `gm_state`, `gm_wea`, `gm_ev`, `gm_lo`, `gm_co`, `gm_env`,
    `gm_enc0..3`, `gm_trap0..3`.
  - Unsaved new boards must not write scoped GM Board data until Save instance.
  - Saved boards must persist edits, generated state, and table changes under
    their scoped board keys.

  ## Feature parity to maintain

  1. HEXcrawl
     - Season, weather override, weather effects, next-check timer.
     - Population, terrain, encounter tier, date/time controls.
     - Proceed / Advance Only / manual time advancement.
     - Event, loot, trap, camp, DC, weather-disadvantage, and encounter-table
       result generation.
     - Session log capped as currently intended and persisted with board state.

  2. Dungeon
     - Room count validation.
     - Population mode and tier selection.
     - Room generation with complications, encounter table results, traps,
       environment severity, loot, and DCs.
     - Clear behavior.

  3. Quest
     - Quest scope and tier selection.
     - Quest count rolls.
     - Quest cards with event, optional encounter, reward/loot, and minimum reward
       behavior.
     - Clear behavior.

  4. Tables
     - Editable seasonal weather, event, loot, complication, encounter, trap, and
       environment tables.
     - Save/reset behavior.
     - Persist custom tables under the scoped GM Board keys for the active board.
     - Keep existing migration of older Italian table/state values where present.

  5. Guide
     - Keep the guide available and consistent with the current mechanics.

  ## Implementation constraints

  - Work primarily in `react-app/public/tools/gmboard.html`.
  - Only touch React shell/support files if required to preserve or repair the
    existing iframe/save integration.
  - Prefer minimal, focused changes. Do not refactor unrelated React app code.
  - This file is standalone and not Vite-bundled; avoid importing npm modules or
    React-only utilities inside it.
  - The current lucide UMD usage is acceptable for this standalone file.
  - Do not add 5etools runtime loading, monster databases, statblocks, combat
    trackers, campaign import, Supabase sync, or image-token logic to GM Board
    unless the user explicitly asks for those features.
  - Do not vendor/copy/commit external 5etools JSON or image assets.
  - Do not introduce new global storage keys unless necessary; if necessary,
    scope them under `gb:board:<id>:` and document them in project memory.
  - Keep generated HTML safe for table values: avoid unnecessary `innerHTML` for
    user-editable strings, or escape values before injecting them.
  - No dead code, no commented-out blocks, no leftover console noise.
  - Keep names and behavior understandable enough for future work on the single
    standalone file.

  ## Project memory

  If behavior, storage keys, or integration details change, update
  `.agent-loop/memory.md` with the new accurate GM Board facts. Preserve existing
  correct memory and do not add speculative notes.

  ## Verification

  Required automated gates:

  - git diff --check
  - npm --prefix react-app test
  - npm --prefix react-app run build

  Required manual smoke:

  - Open `/gmboard?board=new`.
  - Save instance; confirm the iframe reports saved state and the board appears in
    the Home recent-list registry.
  - Reload the saved `/gmboard?board=<id>` URL and confirm state/table edits
    persist only for that board.
  - Exercise HEXcrawl: weather/season, population, terrain, tier, Proceed,
    Advance Only, manual time controls, and log clear.
  - Exercise Dungeon: generate valid room counts, reject invalid room counts,
    clear results.
  - Exercise Quest: generate by each scope, switch tiers, clear results.
  - Exercise Tables: edit, save, reload, reset, and confirm generated flows use
    edited values.
