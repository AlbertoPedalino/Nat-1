agent: codex
backend: cli

# Write-capable build on an isolated in-place branch (never the base branch).
plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feature/unified-character-storage
agent_branch: feat/gmboard-react
allow_dirty: true

task: |
  Build a fully native React GM Board that REPLACES the current standalone
  vanilla-JS iframe app, with full feature parity.

  Project memory (`.agent-loop/memory.md`) already documents the current GM Board
  architecture, storage behavior, route shell, and save/registry contract. USE IT
  as the parity spec. Re-read `react-app/public/tools/gmboard.html` only where
  exact behavior or data tables are needed; do not re-explore the character
  builder, character sheet, encounter builder, adapter, or cloud layers unless a
  very narrow integration question requires it.

  ## Goal

  Port `react-app/public/tools/gmboard.html` to an idiomatic React feature living
  under `react-app/src/pages/gmboard/`. Route `/gmboard` must mount the native
  React page directly - no iframe, no `StandaloneHtmlFrame`, no iframe
  `postMessage` bridge. `pages/gmboard/GmBoardPage.jsx` becomes (or wraps) the
  real React feature instead of an iframe host.

  Keep the GM Board as the same DM utility, not a new product and not a combat
  tracker. In this task, "encounter" means an abstract GM Board table result. It
  does NOT mean the native React Encounter Builder's monster roster, initiative
  tracker, combat HP/death-save system, campaign player import, statblocks, or
  5etools bestiary integration.

  ## Feature parity (must all work)

  Five views with the same user-facing capabilities:

  1. HEXcrawl
     - Season, weather override, weather effects, next-check timer.
     - Population, terrain, encounter tier, date/time controls.
     - Proceed / Advance Only / manual time advancement.
     - Event, loot, trap, camp, DC, weather-disadvantage, and encounter-table
       result generation.
     - Session log capped as currently intended and persisted with board state.

  2. Dungeon
     - Room count validation.
     - Population mode and tier selection.
     - Room generation with complications, encounter table results, traps,
       environment severity, loot, and DCs.
     - Clear behavior.

  3. Quest
     - Quest scope and tier selection.
     - Quest count rolls.
     - Quest cards with event, optional encounter, reward/loot, and minimum reward
       behavior.
     - Clear behavior.

  4. Tables
     - Editable seasonal weather, event, loot, complication, encounter, trap, and
       environment tables.
     - Save/reset behavior.
     - Persist custom tables under the scoped GM Board keys for the active board.
     - Keep existing migration of older Italian table/state values where present.
     - Generated flows must use edited table values after save/reload.

  5. Guide
     - Keep the guide available and consistent with the current mechanics.

  Cross-cutting parity:
  - Keep `?board=new`, saved board ids, active board reuse, and legacy default
    migration behavior.
  - Keep Home integration through `shared/localStorageRegistries.js`:
    route `/gmboard?board=<id>`, new route `/gmboard?board=new`, and scoped key
    prefix `gb:board:<id>:`.
  - Preserve the existing scoped GM Board storage keys where practical:
    `gm_state`, `gm_wea`, `gm_ev`, `gm_lo`, `gm_co`, `gm_env`,
    `gm_enc0..3`, `gm_trap0..3`.
  - Unsaved new boards must not write scoped GM Board data until Save instance.
  - Saved boards must persist edits, generated state, and table changes under
    their scoped board keys.

  ## Architecture requirements - clean, scalable, maintainable (top priority)

  Code quality matters as much as parity. The result must be a clean, scalable,
  maintainable React feature, NOT a literal line-by-line transliteration of the
  standalone HTML file.

  - Idiomatic React: use focused hooks and/or a reducer/context for board state,
    tables, generated results, save status, and persistence. NO module-global
    mutable app state, NO direct DOM string building, NO `innerHTML`.
  - Strict separation of concerns: pure logic for dice, table selection,
    migration, state serialization, time advancement, HEXcrawl generation,
    dungeon generation, quest generation, and DC/reward calculations lives in
    plain side-effect-free modules that are independently unit-testable. React
    components stay thin: render state and wire callbacks.
  - Persistence sits behind hooks or small services. Keep localStorage key
    construction and registry updates in one place.
  - Single source of truth for embedded GM Board tables and constants. Do not
    scatter duplicated seasonal weather, encounter, trap, environment, or DC data
    across components.
  - Suggested layout (adapt as needed):
    `pages/gmboard/GmBoardPage.jsx` (route shell + save wiring)
    `pages/gmboard/components/*` (HexcrawlView, DungeonView, QuestView,
    TablesView, GuideView, controls, result cards, editors)
    `pages/gmboard/logic/*` (dice, tables, migrations, generation, time)
    `pages/gmboard/hooks/*` (board persistence, registry/save status)
    `pages/gmboard/state/*` (reducer/context if used)
  - Styling: match the rest of the app (MUI and existing page conventions). Reuse
    existing app utilities/components where they already exist instead of
    reimplementing them.
  - No dead code, no commented-out blocks, no leftover console noise. Document
    non-obvious generation or migration logic with brief comments.
  - COMPLETE the parity feature set: no stubs, no TODO placeholders, no "left as
    an exercise". Keep the app building at every step.

  ## Save and persistence rewrite

  Replace the iframe `postMessage` save bridge with native React save behavior.
  The user-facing Save instance workflow must still work, but it should call the
  registry/storage helpers directly from React instead of relaying through an
  iframe.

  Requirements:
  - Keep `/gmboard?board=new` as the new-board entrypoint.
  - Save creates or reuses a board id, writes GM Board state/tables to scoped
    keys, and registers/upserts the Home instance entry.
  - Reloading `/gmboard?board=<id>` restores only that board's state and tables.
  - Existing saved GM Board data using the current scoped legacy keys should keep
    loading unless a migration is explicitly documented in `.agent-loop/memory.md`.
  - Avoid introducing new global keys. If new keys are necessary, scope them under
    `gb:board:<id>:` and update memory accurately.

  ## Retiring the old implementation

  - Remove the iframe wiring for GM Board and stop referencing
    `public/tools/gmboard.html` from the `/gmboard` route.
  - Once native React parity is complete, delete or retire
    `react-app/public/tools/gmboard.html` so the app no longer has two GM Board
    implementations.
  - Do NOT remove or break `StandaloneHtmlFrame.jsx` if other tools still use it.
  - Do NOT touch the Encounter Builder, character builder, character sheet,
    adapter, cloud, campaign, Supabase, or image-token layers except for thin
    glue required by the GM Board route/save integration.

  ## Constraints

  - Do not add 5etools runtime loading, monster databases, statblocks, combat
    trackers, campaign import, Supabase sync, or image-token logic to GM Board.
  - Do not vendor/copy/commit external 5etools JSON or image assets.
  - Do not introduce unrelated app-wide refactors.
  - Keep generated text safe by rendering React text nodes or escaped values, not
    string-built HTML.
  - Do not commit, push, or switch the base/protected branch.

  ## Project memory

  Because this task changes GM Board architecture, update `.agent-loop/memory.md`
  with the new accurate facts after implementation: native React route,
  retired/removed standalone HTML, persistence keys, registry behavior, and any
  migration notes. Preserve existing correct memory and remove stale iframe-only
  statements.

  ## Verification

  Required automated gates:

  - git diff --check
  - npm --prefix react-app test
  - npm --prefix react-app run build

  Required manual smoke:

  - Open `/gmboard?board=new`; confirm the native React page renders with no
    iframe.
  - Save instance; confirm the board appears in the Home recent-list registry.
  - Reload `/gmboard?board=<id>` and confirm state/table edits persist only for
    that board.
  - Exercise HEXcrawl: weather/season, population, terrain, tier, Proceed,
    Advance Only, manual time controls, and log clear.
  - Exercise Dungeon: generate valid room counts, reject invalid room counts, and
    clear results.
  - Exercise Quest: generate by each scope, switch tiers, and clear results.
  - Exercise Tables: edit, save, reload, reset, and confirm generated flows use
    edited values.
  - Exercise Guide and confirm its content matches the native mechanics.
