task: |
  Improve the existing unknown-route page in
  `react-app/src/pages/notfound/NotFoundPage.jsx` with a small, polished visual
  pass that remains consistent with the rest of GM-Board.

  Current state:
  - `App.jsx` already routes `*` to `NotFoundPage`.
  - The page already shows the missing path and a Return Home action.
  - The current presentation is functional but visually plain.

  Requirements:
  - Preserve `AppTopBar`, the wildcard route, the displayed pathname/search/hash,
    and the working home navigation.
  - Give the page a clearer D&D map/navigation identity using the existing MUI
    theme and Lucide icons. Keep it restrained and application-like: no external
    assets, gradients, oversized marketing typography, decorative card stacks,
    or unrelated redesigns.
  - Improve hierarchy, spacing, path presentation, and the empty-state focal
    element on both mobile and desktop. Long paths must wrap without overflow.
  - Keep controls accessible and use familiar icons with concise visible text.
  - Extract the pathname/search/hash composition into a small pure JavaScript
    helper beside the page and add a Node test covering normal, query/hash, and
    long or encoded paths. Do not introduce a new test framework.
  - Keep the change focused to the not-found page, its helper, and its test.

  Acceptance conditions:
  - At least one matching `.test.js` file is added or updated.
  - The complete configured test suite passes.
  - The production build passes.
  - Existing `/builder` and `/sheet` redirects remain unchanged.
  - Do not commit or push; the orchestrator owns the approved checkpoint.
