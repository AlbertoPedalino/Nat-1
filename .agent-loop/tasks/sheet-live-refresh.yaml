agent: codex
backend: cli

# Write-capable build on an isolated in-place branch (never the base branch).
plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feat/sheet-realtime-sync
agent_branch: feat/sheet-live-refresh
allow_dirty: true

task: |
  Make the campaign character sheet update LIVE when its cloud row changes, so the
  combat -> sheet direction works in real time. This completes the existing
  combat<->sheet sync: sheet -> combat already works (the encounter builder
  subscribes via `useSheetRealtime`), but the sheet side never refreshes.

  Two surfaces must update live:
  1. The embedded PC sheet inside the encounter Stat Block panel
     (`pages/encounterbuilder/components/PlayerSheetPanel.jsx` ->
     `<CampaignSheetView sheetId=... embedded />`).
  2. The standalone `/campaign-sheet` page (same `CampaignSheetView`).

  Project memory (.agent-loop/memory.md) documents the sheet, cloud layer, and the
  existing combat sync. USE IT. Only read the files below in depth.

  ## Root cause (verified)

  - `pages/campaignsheet/CampaignSheetView.jsx` loads the character ONCE via
    `getCloudCharacter(charId)` in a `useEffect` keyed on `charId`. There is no
    Realtime subscription, so when combat writes new HP/death saves to the cloud
    (debounced, via the `patch_character_data` RPC), the open sheet keeps showing
    the stale snapshot.
  - Realtime is already enabled on `public.characters` (publication added in
    `react-app/supabase/combat_sync.sql`); no new SQL is needed.
  - The encounter side already proves the pattern: `pages/encounterbuilder/hooks/
    useSheetRealtime.js` subscribes to `postgres_changes` UPDATE on
    `public.characters` filtered by `id=eq.<charId>`, gated by `useAuth`
    (`cloudEnabled && status === 'authed'`) and the shared `supabase` client.

  ## Goal

  - Add a Realtime subscription for the displayed character so `CampaignSheetView`
    refreshes when its row changes. On an inbound UPDATE for `charId`, update the
    loaded character (`state.char` / name) from `payload.new.data` so the sheet
    re-renders with the new vitals — no reload.
  - Put the subscription in a small reusable hook (e.g.
    `shared/cloud/useCloudCharacterLive.js` or a hook under campaignsheet) so both
    the embedded panel and the standalone page get it for free. Gate it with the
    same `useAuth` + `supabase` checks; fail-soft (no crash if Realtime is off or
    the socket drops; the one-time load still works).
  - Lifecycle: subscribe on mount / `charId` change, unsubscribe on unmount or
    `charId` change. Unique channel name per charId.

  ## Critical: CharacterSheet must react to externalChar changes

  - Verify `pages/charsheet/CharacterSheet.jsx` re-derives when the `externalChar`
    prop CHANGES (not only on mount). If it copies `externalChar` into internal
    state once, updating the prop will NOT refresh the view — fix it so a new
    `externalChar` re-derives the sheet. This is likely required for the live
    refresh to be visible. Keep edits minimal and do not break the standalone
    builder/sheet round-trip (builder and sheet share one serialized schema).

  ## Editable vs read-only (avoid clobbering edits)

  - Read-only (embedded statblock panel, and `/campaign-sheet` without `edit=1`):
    apply realtime updates directly.
  - Editable (`/campaign-sheet?edit=1`): a live overwrite must NOT discard the
    user's in-progress edits. Use a safe rule — e.g. ignore self-originated echoes
    (compare `updated_at`/value to what we just saved) and/or only apply external
    updates when the local sheet is not dirty. If a fully safe merge is out of
    scope, scope the live refresh to read-only mode and leave a clear seam +
    comment for editable live-merge as follow-up. Never silently lose edits.

  ## Architecture requirements (clean, scalable, maintainable)

  - One small, reusable Realtime hook; do not duplicate the encounter side's logic
    inline in the component. Keep the cloud client usage behind the existing
    `shared/cloud` layer. Reducer/derivation stays pure; all I/O in the hook.
  - MUI; no dead code, no console noise, brief comments for non-obvious logic
    (especially echo / edit-safety), naming consistent with the codebase.

  ## Constraints

  - Runtime fetch only: never vendor/copy/commit 5etools JSON or image assets.
  - Only whitelisted 2024 sources per .agent-loop/config.yaml.
  - No new Supabase table or write path; this is read/subscribe only (the table is
    already in the realtime publication). No schema changes beyond reading existing
    fields.
  - Do not commit, push, or switch the base/protected branch.

  ## Verification

  - cd react-app && npm run build   (must pass; real gate)
  - cd react-app && npm test
  - git diff --check
  - Manual (signed in, two surfaces):
      * open a fight with imported campaign PCs; click a PC -> Stat Block panel shows
        its sheet. Change that PC's HP/temp HP/death saves in the combat entry ->
        after the outbound debounce, the embedded sheet's HP updates live (no
        reload), matching the PlayerCombatSummary line.
      * open `/campaign-sheet?id=<id>` in another tab -> it updates live on the same
        change.
      * editable sheet (`edit=1`): make a local edit, trigger an external change ->
        the local edit is NOT lost.
      * Realtime off / socket drop -> sheet still loads once and works (fail-soft).
