# Fix found by the memory audit: the encounter builder monster-token fallback
# still points at a legacy 2014 asset, violating the 2024-only source whitelist.
agent: codex
backend: cli

plan_only: false
branch_mode: in_place
create_branch: always
base_branch: feature/unified-character-storage
agent_branch: feat/fix-legacy-fallback-token
allow_dirty: true

task: |
  Replace the legacy monster-token fallback with a 2024-source asset.

  Current state: `react-app/src/pages/encounterbuilder/logic/constants.js:4`
  defines `FALLBACK_MONSTER_TOKEN = 'bestiary/tokens/MM/Skeleton.webp'`.
  `MM` is the 2014 Monster Manual, which the project's source whitelist forbids
  (only 2024 sources: XMM etc.). The fallback is used by
  `logic/monsterUtils.js` (token URL resolution against `IMAGE_BASE`) whenever
  a monster has no token of its own.

  Requirements:
  - Point the fallback at the 2024 Monster Manual equivalent:
    `bestiary/tokens/XMM/Skeleton.webp`. Verify the file actually exists on the
    image mirror (`IMAGE_BASE` + path, e.g. with a HEAD/GET request or by
    checking the 5etools-img repository layout for the XMM token folder). If
    Skeleton is not available under `XMM`, pick another common XMM token that
    does exist (e.g. Zombie or Goblin) and use that instead.
  - If no XMM token can be verified as reachable, fall back to a neutral
    solution instead: a small local placeholder under `react-app/src/` assets
    (NOT copied from 5etools) — but prefer the XMM mirror asset.
  - Keep the change minimal: the constant, and only if strictly needed, the
    resolution logic in `monsterUtils.js`. Do not touch unrelated files.
  - Do not vendor or commit any 5etools image into the repository.
  - Also update the related gotcha entry in the project memory: once the
    fallback is 2024-only, emit a corrected memory block reflecting that.

  Verification:
  - cd react-app && npm test
  - cd react-app && npm run build
