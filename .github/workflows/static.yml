name: Deploy React app to Pages

on:
  push:
    branches: ["feature/unified-character-storage"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-app/package-lock.json

      - name: Install dependencies
        working-directory: react-app
        run: npm ci

      - name: Build
        working-directory: react-app
        env:
          # Publishable (anon) key is browser-safe: it ships in the bundle and is
          # guarded by Row Level Security. Override via repo Secrets if you rotate it.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://wvqyaloblllrlieoruuu.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_e6gdwjtA2jSCiiPzEJU_4A_dl6iJvXe' }}
          VITE_AUTH_EMAIL_DOMAIN: ${{ secrets.VITE_AUTH_EMAIL_DOMAIN || 'players.gmboard.local' }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: cp react-app/dist/index.html react-app/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: react-app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
